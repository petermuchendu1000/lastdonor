name: CI

on:
  push:
    branches: [main, staging]
    # A change that touches only prose cannot fail this pipeline: no test in
    # the repository reads a markdown file or the docs directory (verified
    # 2026-10-22 by grepping every `readFileSync`/`readdirSync`/`globSync`
    # call in `src/**/*.test.*` and `test/**` for a `.md` or `docs/` path -
    # nothing matched). 17 of the last 60 commits on main were docs-only,
    # so this skips 28% of runs outright. See docs/97.
    #
    # HAZARD, and the reason this is worth a comment: `main` is currently
    # UNPROTECTED (`protected: false` from the API, 2026-10-22). If branch
    # protection is ever added with `ci-complete` as a REQUIRED check, a
    # docs-only pull request will produce no run, the required check will
    # never report, and the PR will be unmergeable forever. GitHub does not
    # warn about this. If protection is added, either drop these filters or
    # add a no-op twin workflow declaring the same job name.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # Lets the pipeline be triggered by hand or by automation, which it could
  # not be before. See docs/50. `workflow_dispatch` ignores `paths-ignore`,
  # so a hand-dispatched run always executes - which is how the filters
  # above stay testable.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Was '20'. Node 20 reached END OF LIFE on 2026-04-30 (verified against
  # nodejs/Release `schedule.json`, fetched 2026-10-22), and CI was the ONLY
  # place in this project running it: `.nvmrc` says 22 and the Dockerfile
  # builds and runs on `node:22-bookworm-slim`. So CI was testing a runtime
  # that exists nowhere else - it cannot catch a Node 22 defect, and it
  # invents failures that no real environment has.
  #
  # It did exactly that on run 3, the first run ever to reach a runner:
  # `src/components/ui/money-currency.ratchet.test.ts` imported `globSync`
  # from `node:fs`, which only exists from Node 22, so three tests failed in
  # CI and passed everywhere else. Keep this in step with `.nvmrc` and the
  # Dockerfile; `src/ci-node-version.ratchet.test.ts` fails the build if
  # they drift.
  NODE_VERSION: '22'

# Every job pins `ubuntu-24.04` rather than `ubuntu-latest`. Run 1
# (2026-10-21) carried GitHub's own notice: "The ubuntu-latest label will
# migrate to Ubuntu 26 beginning October 19, 2026" - it is migrating now, and
# 24.04 is what the floating label meant up to this point. This pipeline has
# never produced a green run (docs/50), so the first one should not also be
# absorbing an OS bump: a failure then could be the code or the image, with no
# green baseline to tell them apart. Bump deliberately once a run has passed.
#
# The label is written out in each job on purpose. `runs-on` canNOT read the
# `env` context - only `github`, `needs`, `strategy`, `matrix`, `vars` and
# `inputs` - so `${{ env.RUNNER_IMAGE }}` there resolves to empty and
# invalidates the workflow. That is the same class of defect as the
# double-quoted expression this file was just fixed for, and it would be
# equally invisible until someone dispatched a run.
#
# ── Every job declares `timeout-minutes`. ─────────────────────────────────
#
# GitHub's default is 360 minutes PER JOB. With nine job instances (e2e is a
# two-leg matrix) and no timeouts, one wedged step could hold runners for
# 3,240 job-minutes - six hours of silence, then a bill. The numbers below
# sum to 175. See docs/97.
#
# They are sized from the first run that ever reached a runner (run 3,
# 2026-10-22): config 3s, security-audit 53s, lint-and-typecheck 97s,
# unit-tests 159s. Those get roughly 8-10x headroom, which is slack for a
# slow runner and still nothing like six hours. integration-tests, build and
# e2e-tests have NEVER executed in CI, so their numbers are deliberate
# over-estimates rather than measurements - marked as such, and worth
# tightening once each has a green baseline. The point is not to be tight.
# It is to be finite.
#
# `src/ci-workflows.ratchet.test.ts` fails the build if a job omits one.

jobs:
  # Reports which optional secrets exist, so the DB-backed jobs can skip
  # cleanly instead of failing red on a repository that has never had them
  # set. `secrets` cannot be read from a job-level `if`, so it is surfaced
  # here as an output.
  config:
    runs-on: ubuntu-24.04
    # Measured 3s. One shell conditional; it has no reason to take minutes.
    timeout-minutes: 5
    outputs:
      has-db: ${{ steps.probe.outputs.has-db }}
    steps:
      - id: probe
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          if [ -n "$TEST_DATABASE_URL" ]; then
            echo "has-db=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-db=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=DB-backed jobs skipped::TEST_DATABASE_URL is not set, so integration and E2E will not run."
          fi

  # These three are independent of one another and of the database. They used
  # to run strictly in series, so a lint error delayed the unit result by the
  # whole lint job.
  lint-and-typecheck:
    runs-on: ubuntu-24.04
    # Measured 97s (npm ci 43s, lint 15s, tsc 29s).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  unit-tests:
    runs-on: ubuntu-24.04
    # Measured 159s (npm ci 37s, 6,303 tests in 113s).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  security-audit:
    runs-on: ubuntu-24.04
    # Measured 53s (npm ci 34s, audits 5s).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Middleware coverage audit
        run: node scripts/audit-middleware-coverage.mjs
      # Was `--testPathPattern=test/security`, a Jest flag. Vitest rejects it
      # with "Unknown option", so this job failed on every run, and because
      # integration, build and e2e all depended on it the pipeline could never
      # reach them. The positional form is the Vitest equivalent.
      - name: Security canary tests
        run: npx vitest run test/security
      - name: Principles 9-12 audit (Economy, Privilege Separation, Injection, XSS)
        run: node scripts/security-audit-p9-12.mjs

  # Runs its own throwaway Postgres rather than reaching for a secret.
  #
  # This job used to be gated on a `TEST_DATABASE_URL` repository secret that
  # was never set, so it skipped on every run and the suite had never executed
  # anywhere, by anyone (docs/50, docs/97 §4). A service container is better
  # than supplying that secret on every axis that matters here: nothing to
  # leak or rotate, a clean database per run instead of state shared between
  # runs, no possibility of a connection string pointing at production by
  # mistake, and no owner action to wait on. See docs/98.
  #
  # `DATABASE_URL` below is a literal, NOT a secret, and deliberately so: it
  # addresses a database that exists for ~2 minutes inside this job's own
  # network namespace and holds nothing.
  #
  # Verified locally against Postgres 16.15 before this was wired up:
  # `npm run db:migrate` exits 0, and the suite is 83/83 on three consecutive
  # freshly-migrated databases. `gen_random_uuid()` needs NO extension on
  # Postgres 13+ (it is in core), which is the one thing that could have made
  # plain Postgres differ from Supabase here - checked, with only `plpgsql`
  # installed.
  integration-tests:
    runs-on: ubuntu-24.04
    # NOT measured in CI. Locally the suite is ~20s; the rest is npm ci.
    timeout-minutes: 25
    needs: [lint-and-typecheck, unit-tests, security-audit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lastdonor_test
        ports:
          - 5432:5432
        # Without a health check the job races the container and `db:migrate`
        # fails with ECONNREFUSED on a cold runner.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Session mode, direct to Postgres - which is what migrations want
      # anyway (CLAUDE.md: migrations use 5432, not the 6543 pooler).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lastdonor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # `drizzle-kit push` diffs the live schema and applies whatever it
      # infers. docs/34 settled that this project applies ONE validated
      # baseline from migrations-v2 via the migrator. Using the documented
      # path here keeps CI and production on the same mechanism.
      - run: npm run db:migrate
      # DATABASE_URL is the only variable this suite needs - verified by
      # running it with NEXTAUTH_SECRET, both Supabase variables and the
      # Stripe keys all unset: 83/83.
      - run: npm run test:integration

  build:
    runs-on: ubuntu-24.04
    # NOT measured in CI. A Fly build of this app takes ~6 min.
    timeout-minutes: 30
    needs: [lint-and-typecheck, unit-tests, security-audit]
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  # ⛔ STILL SKIPPED, and a database is NOT what it is missing.
  #
  # `integration-tests` above dropped its `TEST_DATABASE_URL` gate for a
  # service container (docs/98). The obvious next move is to do the same here.
  # DO NOT: it would turn this job permanently red, which is worse than
  # skipped.
  #
  # The suite was run locally on 2026-10-22 against a real Postgres with a
  # freshly migrated schema. The harness works - one spec passed 3/3 in 47s -
  # but most specs assume the database ALREADY CONTAINS PUBLISHED CAMPAIGNS
  # and seed nothing. `e2e-02-guest-donate.spec.ts` is typical: it goes to
  # `/campaigns`, clicks "the first campaign link", and asserts a donate form.
  # Against an empty database that locator matches nothing and the test times
  # out.
  #
  # And it is not only an empty-CI-database problem: docs/79 moved every
  # campaign to `under_review`, so `/campaigns` is empty IN PRODUCTION TOO.
  # These specs assert a state the product no longer has by default.
  #
  # So the blocker is FIXTURES, not credentials. Enabling this needs an E2E
  # seed that publishes a known campaign and tears it down - a scoped piece of
  # work, not a config change. Until that exists this job stays gated on the
  # absent secret, which is why the `config` job is still here.
  e2e-tests:
    runs-on: ubuntu-24.04
    # NOT measured in CI - has never run there. PER MATRIX LEG, so 60 total.
    timeout-minutes: 30
    needs: [config, build, integration-tests]
    if: >-
      needs.config.outputs.has-db == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      # Most of this product's traffic is phones, and the mobile layouts are
      # where the recent work landed (docs/48, docs/49), but CI only ever ran
      # Desktop Chrome. Both run now, and one failing does not mask the other.
      matrix:
        project: ['Desktop Chrome', 'Mobile Chrome']
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project="${{ matrix.project }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # A single required status to protect `main` with, so the branch rule does
  # not have to name every job and does not go green when a job is skipped.
  ci-complete:
    runs-on: ubuntu-24.04
    # Measured 3s. Reads job results and exits.
    timeout-minutes: 5
    if: always()
    needs:
      - lint-and-typecheck
      - unit-tests
      - security-audit
      - build
      - integration-tests
      - e2e-tests
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          # Single quotes, not double. GitHub Actions expressions accept ONLY
          # single-quoted string literals; a double-quoted one is a parse
          # error, and a workflow that fails to parse is never queued at all.
          # That is why this pipeline had never run once - see docs/50.
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error title=CI failed::a required job reported '$r'"; exit 1 ;;
            esac
          done
          echo "All required jobs passed (skipped jobs are allowed: see the config job's warning)."
