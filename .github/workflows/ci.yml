name: CI

on:
  push:
    branches: [main, staging]
    # A change that touches only prose cannot fail this pipeline: no test in
    # the repository reads a markdown file or the docs directory (verified
    # 2026-10-22 by grepping every `readFileSync`/`readdirSync`/`globSync`
    # call in `src/**/*.test.*` and `test/**` for a `.md` or `docs/` path -
    # nothing matched). 17 of the last 60 commits on main were docs-only,
    # so this skips 28% of runs outright. See docs/97.
    #
    # HAZARD, and the reason this is worth a comment: `main` is currently
    # UNPROTECTED (`protected: false` from the API, 2026-10-22). If branch
    # protection is ever added with `ci-complete` as a REQUIRED check, a
    # docs-only pull request will produce no run, the required check will
    # never report, and the PR will be unmergeable forever. GitHub does not
    # warn about this. If protection is added, either drop these filters or
    # add a no-op twin workflow declaring the same job name.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # Lets the pipeline be triggered by hand or by automation, which it could
  # not be before. See docs/50. `workflow_dispatch` ignores `paths-ignore`,
  # so a hand-dispatched run always executes - which is how the filters
  # above stay testable.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Was '20'. Node 20 reached END OF LIFE on 2026-04-30 (verified against
  # nodejs/Release `schedule.json`, fetched 2026-10-22), and CI was the ONLY
  # place in this project running it: `.nvmrc` says 22 and the Dockerfile
  # builds and runs on `node:22-bookworm-slim`. So CI was testing a runtime
  # that exists nowhere else - it cannot catch a Node 22 defect, and it
  # invents failures that no real environment has.
  #
  # It did exactly that on run 3, the first run ever to reach a runner:
  # `src/components/ui/money-currency.ratchet.test.ts` imported `globSync`
  # from `node:fs`, which only exists from Node 22, so three tests failed in
  # CI and passed everywhere else. Keep this in step with `.nvmrc` and the
  # Dockerfile; `src/ci-node-version.ratchet.test.ts` fails the build if
  # they drift.
  NODE_VERSION: '22'

# Every job pins `ubuntu-24.04` rather than `ubuntu-latest`. Run 1
# (2026-10-21) carried GitHub's own notice: "The ubuntu-latest label will
# migrate to Ubuntu 26 beginning October 19, 2026" - it is migrating now, and
# 24.04 is what the floating label meant up to this point. This pipeline has
# never produced a green run (docs/50), so the first one should not also be
# absorbing an OS bump: a failure then could be the code or the image, with no
# green baseline to tell them apart. Bump deliberately once a run has passed.
#
# The label is written out in each job on purpose. `runs-on` canNOT read the
# `env` context - only `github`, `needs`, `strategy`, `matrix`, `vars` and
# `inputs` - so `${{ env.RUNNER_IMAGE }}` there resolves to empty and
# invalidates the workflow. That is the same class of defect as the
# double-quoted expression this file was just fixed for, and it would be
# equally invisible until someone dispatched a run.
#
# ── Every job declares `timeout-minutes`. ─────────────────────────────────
#
# GitHub's default is 360 minutes PER JOB. With nine job instances (e2e is a
# two-leg matrix) and no timeouts, one wedged step could hold runners for
# 3,240 job-minutes - six hours of silence, then a bill. The numbers below
# sum to 175. See docs/97.
#
# They are sized from the first run that ever reached a runner (run 3,
# 2026-10-22): config 3s, security-audit 53s, lint-and-typecheck 97s,
# unit-tests 159s. Those get roughly 8-10x headroom, which is slack for a
# slow runner and still nothing like six hours. integration-tests, build and
# e2e-tests have NEVER executed in CI, so their numbers are deliberate
# over-estimates rather than measurements - marked as such, and worth
# tightening once each has a green baseline. The point is not to be tight.
# It is to be finite.
#
# `src/ci-workflows.ratchet.test.ts` fails the build if a job omits one.

jobs:
  # Reports which optional secrets exist, so the DB-backed jobs can skip
  # cleanly instead of failing red on a repository that has never had them
  # set. `secrets` cannot be read from a job-level `if`, so it is surfaced
  # here as an output.
  # The `config` job is GONE, deliberately.
  #
  # It existed to probe for a `TEST_DATABASE_URL` secret and emit
  #
  #     ::warning title=DB-backed jobs skipped::TEST_DATABASE_URL is not set,
  #     so integration and E2E will not run.
  #
  # which gated both DB-backed jobs. Neither statement is true any more:
  # `integration-tests` brought its own `postgres:16` service container in
  # docs/98, `e2e-tests` does the same now, and NEITHER references that
  # secret. The job's only remaining effect would be a warning annotation
  # saying two jobs were skipped while they were in fact running - a false
  # lead planted in the logs of a healthy run, which is the exact category
  # of noise docs/98 §2 removed from the Postgres health check.
  #
  # ⛔ Setting `TEST_DATABASE_URL` is still REFUSED, not merely unnecessary:
  # these jobs run `db:migrate` and then suites that truncate or delete rows,
  # and the only connection string this project has is PRODUCTION. See
  # docs/98 §1.
  #
  # These three are independent of one another and of the database. They used
  # to run strictly in series, so a lint error delayed the unit result by the
  # whole lint job.
  lint-and-typecheck:
    runs-on: ubuntu-24.04
    # Measured 97s (npm ci 43s, lint 15s, tsc 29s).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  unit-tests:
    runs-on: ubuntu-24.04
    # Measured 159s (npm ci 37s, 6,303 tests in 113s).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  security-audit:
    runs-on: ubuntu-24.04
    # Measured 53s (npm ci 34s, audits 5s).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Middleware coverage audit
        run: node scripts/audit-middleware-coverage.mjs
      # Was `--testPathPattern=test/security`, a Jest flag. Vitest rejects it
      # with "Unknown option", so this job failed on every run, and because
      # integration, build and e2e all depended on it the pipeline could never
      # reach them. The positional form is the Vitest equivalent.
      - name: Security canary tests
        run: npx vitest run test/security
      - name: Principles 9-12 audit (Economy, Privilege Separation, Injection, XSS)
        run: node scripts/security-audit-p9-12.mjs

  # Runs its own throwaway Postgres rather than reaching for a secret.
  #
  # This job used to be gated on a `TEST_DATABASE_URL` repository secret that
  # was never set, so it skipped on every run and the suite had never executed
  # anywhere, by anyone (docs/50, docs/97 §4). A service container is better
  # than supplying that secret on every axis that matters here: nothing to
  # leak or rotate, a clean database per run instead of state shared between
  # runs, no possibility of a connection string pointing at production by
  # mistake, and no owner action to wait on. See docs/98.
  #
  # `DATABASE_URL` below is a literal, NOT a secret, and deliberately so: it
  # addresses a database that exists for ~2 minutes inside this job's own
  # network namespace and holds nothing.
  #
  # Verified locally against Postgres 16.15 before this was wired up:
  # `npm run db:migrate` exits 0, and the suite is 83/83 on three consecutive
  # freshly-migrated databases. `gen_random_uuid()` needs NO extension on
  # Postgres 13+ (it is in core), which is the one thing that could have made
  # plain Postgres differ from Supabase here - checked, with only `plpgsql`
  # installed.
  integration-tests:
    runs-on: ubuntu-24.04
    # NOT measured in CI. Locally the suite is ~20s; the rest is npm ci.
    timeout-minutes: 25
    needs: [lint-and-typecheck, unit-tests, security-audit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lastdonor_test
        ports:
          - 5432:5432
        # Without a health check the job races the container and `db:migrate`
        # fails with ECONNREFUSED on a cold runner.
        #
        # `-U postgres` is not optional noise. A bare `pg_isready` connects as
        # the container's OS user, which is `root`, and there is no such
        # Postgres role - so run 6's service-container log carried
        #
        #     FATAL:  role "root" does not exist
        #
        # once every 10 seconds for the life of the job. The check still
        # PASSES (a FATAL reply proves the server is up, which is all
        # `pg_isready` asks), so this was cosmetic - but it plants a FATAL in
        # the logs of a healthy run, which is exactly the kind of false lead
        # someone debugging a real failure would chase first.
        options: >-
          --health-cmd "pg_isready -U postgres -d lastdonor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Session mode, direct to Postgres - which is what migrations want
      # anyway (CLAUDE.md: migrations use 5432, not the 6543 pooler).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lastdonor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # `drizzle-kit push` diffs the live schema and applies whatever it
      # infers. docs/34 settled that this project applies ONE validated
      # baseline from migrations-v2 via the migrator. Using the documented
      # path here keeps CI and production on the same mechanism.
      - run: npm run db:migrate
      # DATABASE_URL is the only variable this suite needs - verified by
      # running it with NEXTAUTH_SECRET, both Supabase variables and the
      # Stripe keys all unset: 83/83.
      - run: npm run test:integration

  build:
    runs-on: ubuntu-24.04
    # NOT measured in CI. A Fly build of this app takes ~6 min.
    timeout-minutes: 30
    needs: [lint-and-typecheck, unit-tests, security-audit]
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  # ⛔ STILL SKIPPED, and a database is NOT what it is missing.
  #
  # `integration-tests` above dropped its `TEST_DATABASE_URL` gate for a
  # service container (docs/98). That is what this job now does.
  #
  # THE HISTORY MATTERS, because the comment here used to say "DO NOT" and was
  # right at the time. The blocker was never credentials: most specs assumed
  # the database ALREADY CONTAINED PUBLISHED CAMPAIGNS and seeded nothing,
  # which stopped being true even in production when docs/79 moved every
  # campaign to `under_review`. So the specs asserted a state the product no
  # longer has, and a service container alone would have made this job
  # permanently red - worse than skipped, because a standing red check trains
  # people to ignore CI, which is how this pipeline reached five days of green
  # local checks and zero runs (docs/50).
  #
  # Both halves are now done. `docs/99` §1 built the seed fixture; `docs/99`
  # §8 reconciled the specs and found five product defects doing it. Measured
  # locally on 2026-10-22, both Chromium projects: 128 passed, 0 failed, 24
  # declared skips, 241s.
  #
  # ⚠️ This job had still never executed anywhere when it was enabled, so
  # treat its first runs as unproven. The env below is therefore deliberately
  # SELF-SUFFICIENT: it references no repository secret at all, so the job
  # cannot fail for a secret nobody can see. Every value is a format or
  # entropy check (`src/lib/validate-secrets.ts`), not a credential - the
  # suite talks to no payment provider, sends no mail, and its card-rail tests
  # are skipped because there IS no card rail (docs/72).
  e2e-tests:
    runs-on: ubuntu-24.04
    # NOT measured in CI - has never run there. PER MATRIX LEG, so 60 total.
    timeout-minutes: 30
    needs: [build, integration-tests]
    # Fork PRs only: no secrets are referenced below, but a fork can still
    # change the specs, and a browser running arbitrary branch code on our
    # runner is not something to grant by default.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      # Most of this product's traffic is phones, and the mobile layouts are
      # where the recent work landed (docs/48, docs/49), but CI only ever ran
      # Desktop Chrome. Both run now, and one failing does not mask the other.
      #
      # These are also the only two projects `playwright.config.ts` runs by
      # default: nothing in this repo installs Firefox or WebKit, so those
      # projects sit behind `PW_ALL_BROWSERS=1` and that gap is open
      # (docs/99 §5.1).
      matrix:
        project: ['Desktop Chrome', 'Mobile Chrome']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lastdonor_test
        ports:
          - 5432:5432
        # `-U postgres` is not optional noise - see the identical block on
        # `integration-tests` for why a bare `pg_isready` plants a FATAL in
        # the logs of a healthy run.
        options: >-
          --health-cmd "pg_isready -U postgres -d lastdonor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # ⛔ Every value here is a THROWAWAY and must stay one. None is read as
      # a credential; `validate-secrets.ts` checks length and prefix only, and
      # `src/instrumentation.ts` THROWS on a missing or malformed one in a
      # production build - which is what this suite runs. The failure mode is
      # the reason they are spelled out rather than left to secrets: every
      # route answers 500, Playwright sees only a webServer timeout, and the
      # JSON report records `expected: 0, unexpected: 0`, which reads like a
      # pass. Measured locally 2026-10-22: one absent PASSWORD_PEPPER cost a
      # full 300s run and produced no test results.
      #
      # localhost, not the Supabase pooler: the fixture REFUSES any non-local
      # host unless `E2E_ALLOW_NONLOCAL_DB=1`, because it inserts and deletes
      # rows and the only connection string this project really has is
      # production (docs/98 §1, docs/99 §2). Do not set that variable here.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lastdonor_test
      NEXTAUTH_SECRET: ci-e2e-throwaway-nextauth-secret-not-real-0001
      PASSWORD_PEPPER: ci-e2e-throwaway-pepper-not-a-real-secret-0001
      CRON_SECRET: ci-e2e-throwaway-cron-secret-not-a-real-secret-01
      # Format-only: `^sk_(test|live)_` and `^whsec_`. The card rail is dead
      # (docs/72) and every test that would touch it is skipped, so these are
      # never used to call Stripe.
      STRIPE_SECRET_KEY: sk_test_ciE2eThrowawayNotARealStripeKey00
      STRIPE_WEBHOOK_SECRET: whsec_ciE2eThrowawayNotARealWebhookSecret
      # Distinct from NEXTAUTH_SECRET, or `validate-secrets.ts` warns about
      # key separation.
      NEWSLETTER_UNSUBSCRIBE_SECRET: ci-e2e-throwaway-unsubscribe-secret-01
      SETTINGS_ENCRYPTION_KEY: ci-e2e-throwaway-settings-enc-key-0000001
      # Without this, NextAuth v5 off Vercel refuses the localhost host and
      # EVERY `/api/auth/session` call fails with `UntrustedHost` (docs/26).
      # The middleware's auth layer then goes inert - locally that turned
      # the `/admin` redirect's callbackUrl from the requested path into a
      # hardcoded `/admin` - and every spec that branches on being signed
      # in is measured against a broken endpoint. `fly.toml [env]` sets it
      # in production for exactly this reason.
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The documented migration path, same as `integration-tests`: one
      # validated baseline from migrations-v2 through the migrator, never
      # `drizzle-kit push` (docs/34).
      - run: npm run db:migrate
      # `playwright.config.ts`'s webServer seeds, builds and starts. The seed
      # MUST precede the build: `next build` prerenders `/donate`, whose guard
      # hides the form unless the general fund row is donatable (docs/42), so
      # building against an empty database bakes in "not accepting donations"
      # and seeding afterwards cannot undo it. `npm run e2e:build` exists for
      # the same reason when building by hand.
      - run: npm run test:e2e -- --project="${{ matrix.project }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # A single required status to protect `main` with, so the branch rule does
  # not have to name every job and does not go green when a job is skipped.
  ci-complete:
    runs-on: ubuntu-24.04
    # Measured 3s. Reads job results and exits.
    timeout-minutes: 5
    if: always()
    needs:
      - lint-and-typecheck
      - unit-tests
      - security-audit
      - build
      - integration-tests
      - e2e-tests
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          # Single quotes, not double. GitHub Actions expressions accept ONLY
          # single-quoted string literals; a double-quoted one is a parse
          # error, and a workflow that fails to parse is never queued at all.
          # That is why this pipeline had never run once - see docs/50.
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error title=CI failed::a required job reported '$r'"; exit 1 ;;
            esac
          done
          echo "All required jobs passed. Skipped jobs are allowed: e2e-tests skips itself on a fork PR."
