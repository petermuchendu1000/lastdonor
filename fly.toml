# =============================================================================
#  LastDonor - Fly.io app configuration
#  Implements docs/26 "Deployment Architecture" §10 step 4.
#
#  Scope: this file configures the app only. Secrets are set out of band with
#  `fly secrets set` (docs/26 §10 step 5) and are deliberately absent here.
#  Cloudflare DNS, cache rules and the cron Worker are steps 7-8 and live
#  outside this repo.
# =============================================================================

# Confirm this matches the real Fly app before the first deploy; `fly deploy`
# will not create it for you non-interactively.
app = "lastdonor"

# -----------------------------------------------------------------------------
# PRIMARY REGION - DELIBERATE, DO NOT "OPTIMISE" THIS.
#
# `arn` is Stockholm, which is the Fly region colocated with AWS `eu-north-1`,
# where the Supabase project lives. docs/26 §6: "Region colocation is the
# largest single latency factor. Most pages are DB-driven, so place the Fly
# primary region in the same geography as the Supabase project. One region
# close to Postgres beats multi-region with a single primary."
#
# Moving this closer to users instead of closer to Postgres puts every query on
# a transatlantic round trip, and the reads that would benefit are already
# served from Cloudflare's edge (docs/26 §5 layer 1). Do not add regions until
# read replicas exist to go with them (docs/26 §8).
# -----------------------------------------------------------------------------
primary_region = "arn"

# Give in-flight work time to finish on rolling deploys and machine restarts.
# The donation webhook runs a single DB transaction plus post-commit side
# effects (docs/26 §7); cutting it mid-flight is the one failure this app
# cannot shrug off. Next's standalone server shuts down on SIGTERM, and
# dumb-init (the image's PID 1) forwards it.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

  # Build-time-only, non-secret client config. `NEXT_PUBLIC_*` is inlined into
  # the client bundle by the compiler, so setting these as Fly secrets has no
  # effect - they must be build args. Fill in the publishable values before
  # the first deploy; they are public by definition.
  [build.args]
    # Flipped to the real domain 2026-10-14, in the same change that cut DNS
    # over: lastdonor.org's apex A/AAAA now point at this app's Fly addresses
    # (DNS-only, see §"Cloudflare proxy" note below) and Fly holds certificates
    # for the apex and www. This value is COMPILED IN, so a Fly secret cannot
    # override it — changing the canonical origin always requires a redeploy.
    NEXT_PUBLIC_APP_URL = "https://lastdonor.org"

    # Drives `images.remotePatterns` in `next.config.ts` as well as the client
    # bundle; see `src/lib/supabase-host.ts`. Verified 2026-10-14 as the only
    # Supabase project in this account.
    NEXT_PUBLIC_SUPABASE_URL = "https://vavxdjqufxrsbyohcwdh.supabase.co"
    # NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY = "pk_live_..."
    # Sentry DSN is public by design (it is embedded in the client bundle on
    # every site that uses Sentry); it identifies a project, it does not
    # authorise reading anything. It is a build arg because NEXT_PUBLIC_* is
    # inlined by the compiler — a Fly secret for it would be inert.
    NEXT_PUBLIC_SENTRY_DSN = "https://4f46f08db83665f562cffc9ce28156b7@o4512221246521344.ingest.de.sentry.io/4512257598750800"
    # NEXT_PUBLIC_TAWK_PROPERTY_ID = ""
    # NEXT_PUBLIC_TAWK_WIDGET_ID = ""

  # The build also needs a reachable Postgres, because three SSG routes call
  # `generateStaticParams()` straight against the database. It is passed as a
  # BuildKit secret so it never lands in a layer:
  #
  #   fly deploy --build-secret database_url="postgresql://...:6543/postgres"
  #
  # A pooled, read-only URL is fine here - the build only SELECTs.

# -----------------------------------------------------------------------------
# Non-secret runtime environment. Secrets go through `fly secrets set` only.
# -----------------------------------------------------------------------------
[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  NEXT_TELEMETRY_DISABLED = "1"

  # ---------------------------------------------------------------------------
  # CLIENT IP RESOLUTION. `cf` is safe to deploy whether or not the proxy is on,
  # because since 2026-10-24 it decides PER REQUEST rather than per deployment.
  #
  # ⚠️ The hop count stays at 1 FOREVER. See docs/105. A hop count describes one
  # ingress path and this app has two - through Cloudflare, and straight to
  # `lastdonor.fly.dev` / `origin.lastdonor.org`, which never stop working. Fly
  # appends exactly one entry, so 1 is right for the direct path; `cf` mode does
  # not read this value at all, and `xff` mode needs it to be 1.
  #
  # HISTORY, and why it is no longer stated as a rule. On 2026-10-14 this file
  # carried `cf` / `2` while Cloudflare was not in front of the app, which was
  # unsafe in two independent ways against the code OF THAT DAY:
  #
  #   1. `CLIENT_IP_SOURCE=cf` made `cf-connecting-ip` authoritative whenever
  #      present, so with nothing upstream overwriting it any client set it to
  #      anything, minted unlimited distinct rate-limit keys, and bypassed
  #      every limit. FIXED IN THE CODE on 2026-10-24: `cf` now requires the
  #      request to have arrived from Cloudflare, so this is no longer a
  #      property of the configuration at all.
  #   2. Even on fallthrough, `TRUSTED_PROXY_HOPS=2` with Fly's single appended
  #      hop computes `index = entries.length - 2 = 0` on a two-entry header -
  #      the LEFT-most, client-supplied entry. That is precisely what the
  #      comment at `rate-limit.ts:141` warns is "not evidence of anything".
  #
  # These are plain configuration, not secrets, so they live here where they are
  # version-controlled and reviewable. They were ALSO being staged into the Fly
  # secret store with the opposite values, which gave one security control two
  # contradictory sources of truth; the secret-store copies have been removed so
  # this file is the only place they are set.
  # ---------------------------------------------------------------------------
  CLIENT_IP_SOURCE = "cf"
  TRUSTED_PROXY_HOPS = "1"

  # ---------------------------------------------------------------------------
  # ⬇ THE CUTOVER BLOCK THAT USED TO LIVE HERE IS GONE, AND SO IS ITS PREMISE.
  #
  # It staged `cf` / `2`, to be applied in the same commit that turns the proxy
  # on. Both halves were wrong, and the reasoning is worth keeping because it
  # reads as careful:
  #
  #   "Deploying `cf`/`2` first is safe: `cf-connecting-ip` is simply absent
  #    until the proxy is on."
  #
  # Absent on requests THROUGH Cloudflare, which is not the set that matters.
  # `lastdonor.fly.dev` is a Fly hostname outside this DNS zone and
  # `origin.lastdonor.org` is grey-cloud on purpose, so after the flip a caller
  # can still reach the origin directly and type whatever `cf-connecting-ip`
  # they like - and the old `cf` branch returned it unconditionally. That is
  # unlimited rate-limit keys against login, SMS and the PayHero phone guard,
  # permanently, not just during a cutover window.
  #
  # And `2` was unsafe in the mirror direction: on a direct hit the trusted
  # index lands on the caller's own `X-Forwarded-For` prefix.
  #
  # `src/lib/rate-limit.ts` now takes the one value a caller cannot choose - the
  # address the request arrived from, which Fly appends to `X-Forwarded-For` -
  # and trusts `cf-connecting-ip` only when that address is inside Cloudflare's
  # published space (`src/lib/cloudflare-ips.ts`). Right for both paths at once,
  # with no window and nothing to sequence.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # CLOUDFLARE PROXY IS DELIBERATELY OFF (grey cloud) as of the 2026-10-14 DNS
  # cutover, which is why `xff` / `1` above is correct.
  #
  # lastdonor.org is on Cloudflare and its records WERE proxied (pointing at a
  # dead Vercel deployment). They are now DNS-only, pointing straight at Fly.
  # Turning the orange cloud back on is a deliberate multi-part change, not a
  # toggle, and doing it piecemeal breaks things silently:
  #
  #   1. Flip CLIENT_IP_SOURCE/TRUSTED_PROXY_HOPS to `cf` / `2` IN THE SAME
  #      change (docs/32 §4). The pairing is enforced by
  #      test/security/client-ip-trust-boundary.test.ts.
  #   2. Cloudflare SSL mode must be Full (strict) (docs/26 §3), or the proxy
  #      will not validate the Fly certificate.
  #   3. Cloudflare's proxy times out at 100s. ELEVEN routes declare
  #      maxDuration 120-300s, including `simulate-donations` (120s), so they
  #      need the DNS-only `origin.lastdonor.com` hostname from docs/26 §3 or
  #      they will 524 under the proxy.
  #   4. WAF skip rules for both webhook paths, or Stripe deliveries get
  #      challenged and silently fail (docs/26 §10 step 8).
  # ---------------------------------------------------------------------------

  # REQUIRED off Vercel. This is a Vercel coupling docs/26 §1 does not list.
  # NextAuth v5 only trusts the forwarded host when `AUTH_TRUST_HOST` is set,
  # `trustHost: true` is in the auth config, or it detects `VERCEL=1`. None of
  # those is true on Fly, and `src/lib/auth.ts` sets no `trustHost`, so without
  # this every auth call fails with `UntrustedHost`.
  #
  # VERIFIED 2026-10-14 by booting the standalone server built from this
  # Dockerfile: with NEXTAUTH_URL set but AUTH_TRUST_HOST unset,
  # `[auth][error] UntrustedHost: Host must be trusted` fired on every
  # `/api/auth/session` call from middleware (4 occurrences in one short run);
  # with AUTH_TRUST_HOST=true, zero errors, `/api/auth/session` returned 200
  # and `/dashboard` correctly 307'd an anonymous visitor to login. Setting
  # NEXTAUTH_URL alone does NOT fix it.
  #
  # Trade-off: the forwarded Host header is now trusted. That is sound here
  # because the Fly proxy terminates and sets it, `force_https` is on below,
  # and docs/26 §3 requires Cloudflare SSL mode Full (strict) in front.
  AUTH_TRUST_HOST = "true"

[deploy]
  # ---------------------------------------------------------------------------
  # Drizzle migrations, once per deploy, before any traffic shifts. A non-zero
  # exit aborts the deploy and the previous release keeps serving.
  #
  # The script is baked into the image at /usr/local/bin/release-migrate (see
  # the Dockerfile) rather than inlined here, so that:
  #   - the shell quoting lives in a shell file,
  #   - it asserts MIGRATION_DATABASE_URL is set and is NOT port 6543 before
  #     connecting. docs/26 §6 and CLAUDE.md: migrations run over port 5432
  #     (session mode), because transaction-mode pooling cannot hold the
  #     session state that DDL and advisory locks need. 6543 is the
  #     application's pooled port and is rejected outright.
  #   - it reads `out` back out of `drizzle.config.ts` through the same TS
  #     loader drizzle-kit uses, so it cannot drift from the folder drizzle-kit
  #     will actually read, and it refuses to run if that folder's
  #     `meta/_journal.json` has fewer entries than it has `.sql` files.
  #     drizzle-orm's migrator iterates only `journal.entries`, so without that
  #     guard an under-journalled folder would be applied in part and exit 0,
  #     reporting a successful deploy over a short schema. That is the state
  #     CLAUDE.md records for the old `src/db/migrations` (9 entries, 33 files).
  #
  # Checked 2026-10-14 against the tree as the lead session's journal repair
  # left it: `out` is `./src/db/migrations-v2`, 1 squashed baseline migration
  # and 1 journal entry, so the guard passes and the command runs. Verified by
  # executing this exact script against a scratch Postgres 16 in session mode:
  # it applied the baseline, created 31 tables, wrote 1 row to
  # `drizzle.__drizzle_migrations`, and produced
  # `idx_donations_stripe_payment_id` as a UNIQUE index.
  #
  # ⚠ The baseline is NOT idempotent - plain `CREATE TYPE` / `CREATE TABLE`,
  # no `IF NOT EXISTS`. Against a database that already carries the schema it
  # will fail on the first `CREATE TYPE`, which aborts the deploy with the
  # previous release still serving. Pre-stamp `drizzle.__drizzle_migrations`
  # with the baseline's hash on an existing database, or set
  # `SKIP_MIGRATIONS=1` as a Fly secret to deploy without migrating.
  #
  # Set before the first deploy:
  #   fly secrets set MIGRATION_DATABASE_URL='postgresql://...@...:5432/postgres'
  # ---------------------------------------------------------------------------
  release_command = "/usr/local/bin/release-migrate"

  # Rolling, so there is always a machine serving. This is the other half of
  # why docs/26 §9 starts at two machines, and why the shared ISR cache
  # (docs/26 §5 layer 2, migration step 3) must land before machine count > 1
  # is safe: two machines without it serve divergent stale HTML silently.
  strategy = "rolling"

[http_service]
  internal_port = 3000
  force_https = true

  # ---------------------------------------------------------------------------
  # NO SCALE-TO-ZERO. docs/26 §7: "Never scale to zero. A cold start on a
  # payment webhook risks a timeout; Stripe retries, but on a payments platform
  # the right answer is a warm machine."
  #
  # `auto_stop_machines = "off"` is what actually prevents it - machines are
  # never stopped, so there is never a cold start to pay for.
  # `min_machines_running = 1` is the explicit floor required by docs/26 §9 and
  # is kept as a second line of defence: if auto-stop is ever switched on, the
  # floor still holds. Fly only consults it when auto-stop is enabled, so the
  # two settings together are belt and braces, not a contradiction.
  # ---------------------------------------------------------------------------
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    # A Node process serving SSR; these are starting values, not measurements.
    # docs/26 §9 is explicit that sizing cannot be derived without traffic
    # numbers - raise or lower from Fly metrics and the p95 signal in that
    # table rather than from intuition.
    soft_limit = 150
    hard_limit = 250

  # ---------------------------------------------------------------------------
  # HEALTH CHECK - /api/v1/live, NEVER /api/v1/health.
  #
  # docs/26 §1 and docs/32 §11 (audit R-09 / P1-13): `/api/v1/health` calls
  # `stripe.balance.retrieve()` and returns 503 if ANY dependency check fails.
  # Shared dependencies fail on every machine at once, so pointing Fly at it
  # would turn a Stripe or Supabase blip into Fly killing the entire fleet
  # simultaneously - an outage caused entirely by the monitoring.
  #
  # `/api/v1/live` is the shallow, process-only probe built for this: no DB, no
  # Stripe, no Redis, no await. It can only fail for reasons local to the one
  # process a restart would actually fix.
  #
  # Verified it answers unauthenticated: `src/middleware.ts` is default-deny
  # over `/api/*`, and `PUBLIC_API_ROUTES` carries an anchored
  # `/^\/api\/v1\/live$/` entry for exactly this reason. A restart probe cannot
  # carry a credential.
  #
  # Keep `/api/v1/health` as the deep readiness/diagnostic endpoint for humans
  # and external uptime monitoring, where a 503 during a Stripe outage is the
  # signal you want.
  # ---------------------------------------------------------------------------
  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/live"
    protocol = "http"
    interval = "15s"
    timeout = "5s"
    # Next's standalone server is listening in a second or two, but the first
    # request compiles nothing and touches no dependency, so this is generous
    # rather than tight.
    grace_period = "15s"
    [http_service.checks.headers]
      User-Agent = "fly-health-check"

# -----------------------------------------------------------------------------
# Machine size. docs/26 §9: "Starting point: 2 × shared-cpu-2x (1 GB) Machines,
# min_machines_running = 1, in the Supabase region."
#
# `fly scale count 2` sets the machine count; this block sets what each one is.
# 1 GB is the figure to watch first: a Next SSR process plus sharp's libvips
# working set is the memory consumer, and the Fly metrics signal in docs/26 §9
# says scale up before scaling out.
# -----------------------------------------------------------------------------
[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  processes = ["app"]

# -----------------------------------------------------------------------------
# Deliberately NOT configured here:
#
#  * `[[statics]]` - Next already serves `/_next/static` with immutable
#    headers set in `next.config.ts`, and Cloudflare caches it at the edge
#    (docs/26 §5 layer 1). A Fly static mount would duplicate that and bypass
#    those headers.
#  * `[mounts]` - no volume. The app is stateless; ISR state is per-machine
#    disk today and moves to Upstash in docs/26 §5 layer 2.
#  * `[[services]]` for the grey-cloud `origin.lastdonor.com` hostname
#    (docs/26 §3). It is the same HTTP service on the same port; it is a
#    Cloudflare DNS-only record plus `fly certs add origin.lastdonor.com`, not
#    a second Fly service.
# -----------------------------------------------------------------------------
