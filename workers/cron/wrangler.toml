# LastDonor cron dispatcher. See docs/66.
#
# ONE trigger, not nine. Cloudflare caps Cron Triggers at 5 PER ACCOUNT on
# the free plan (verified against their limits page, 2026-10-16), so the nine
# schedules in vercel.json could never have existed here. The Worker decides
# internally which jobs are due; the table lives in the app at
# src/lib/cron-schedule.ts and is unit-tested by `npm run test:unit`.
#
# Deploy:
#   cd workers/cron
#   npx wrangler secret put CRON_SECRET     # must match the Fly secret
#   npx wrangler deploy
#
# Watch it run:
#   npx wrangler tail lastdonor-cron --format pretty

name = "lastdonor-cron"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Straight to Fly, not through the proxied hostname. Cloudflare's proxy has a
# 100s ceiling and seven cron routes declare maxDuration = 300, so a proxied
# dispatch would truncate them mid-run. docs/26 §4 called for a grey-cloud
# `origin.lastdonor.com`; that record does not exist, and the Fly hostname
# achieves the same thing without one.
[vars]
ORIGIN = "https://lastdonor.fly.dev"

# ⬇ NOT APPLIED, and the reason is on purpose. See docs/104 §2.
#
# `origin.lastdonor.org` now EXISTS (created 2026-10-24, grey cloud, Fly cert
# issued and verified), so the premise of the comment above - "that record
# does not exist" - no longer holds. The retarget would be:
#
#   ORIGIN = "https://origin.lastdonor.org"
#
# It was NOT made, because it buys nothing. `lastdonor.fly.dev` is not in the
# Cloudflare zone at all, so it is already immune to the 100s proxy ceiling
# that the grey-cloud hostname exists to dodge. Against that, this Worker is
# the only scheduler this project has ever had working (docs/65 found NINE
# jobs dead for the platform's entire life; docs/66 is the first one to fire),
# and `reconcile` is a financial control.
#
# There is also one thing that cannot be verified without deploying it: how a
# Worker resolves a GREY-CLOUD hostname in a zone on its OWN account. docs/66
# already records being wrong about exactly this class of thing - an IP
# allow-list advised from a `curl` measurement when the real calls egressed
# from a different address. Its lesson was to measure the path the actual
# calls take, and that path cannot be measured from here.
#
# Take this change only if domain independence from `fly.dev` is wanted, and
# verify it by watching for a fresh `cron.%` row in `audit_logs` within ten
# minutes of deploying.

# CRON_SECRET is a secret, set with `wrangler secret put`, never listed here.

[triggers]
crons = ["*/5 * * * *"]

# No `fetch` handler is exported, so this Worker has no HTTP surface at all:
# it can only be invoked by its own schedule. That is deliberate. A manual
# "run job now" endpoint would be a second place the CRON_SECRET is accepted,
# and the same thing is already achievable by calling the Fly route directly.
[observability]
enabled = true
